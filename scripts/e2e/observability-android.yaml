appId: io.pbreplay.verification
name: Android errors and logs with native lifecycle
tags:
  - observability
  - android
  - local
---
# The waits are ceilings, and a passing run never reaches them. A cold emulator took 23 seconds
# to open this app and about 40 to show its first result.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: ".*STARTUP PASS.*"
    timeout: 150000
- tapOn: "Capture JS stack"
- extendedWaitUntil:
    visible: ".*STACK PASS.*"
    timeout: 90000
- tapOn: "Capture DOMException"
- assertVisible: ".*DOMEXCEPTION PASS.*"
- tapOn: "Capture grouped errors"
- assertVisible: ".*GROUPING PASS.*"
- tapOn: "Start replay only"
- assertVisible: ".*REPLAY START PASS.*"
- tapOn: "Arm background check"
- assertVisible: ".*BACKGROUND ARMED.*"
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: ".*BACKGROUND PASS.*"
    timeout: 90000
- assertVisible: ".*STARTUP PASS.*"
- assertVisible: ".*STACK PASS.*"
- takeScreenshot: observability-android
