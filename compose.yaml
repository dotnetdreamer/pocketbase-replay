services:
  replay:
    build: .
    ports:
      - "127.0.0.1:8097:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_public:/pb/pb_public:ro
    environment:
      REPLAY_AUTH_URL: ${REPLAY_AUTH_URL:-}
      REPLAY_ERASE_KEY: ${REPLAY_ERASE_KEY:-}
      # Must be set behind a proxy (e.g. X-Forwarded-For), or all clients share one per-IP limit.
      REPLAY_TRUSTED_PROXY: ${REPLAY_TRUSTED_PROXY:-}
      REPLAY_APP_VERSION_PREFIX: ${REPLAY_APP_VERSION_PREFIX:-}
      REPLAY_EXTRA_APP_VERSION_PREFIX: ${REPLAY_EXTRA_APP_VERSION_PREFIX:-}
      REPLAY_EXTRA_PLATFORM: ${REPLAY_EXTRA_PLATFORM:-}
      # Lets build jobs upload source maps with pb-replay-sourcemaps (32 to 512 characters).
      REPLAY_SOURCEMAP_KEY: ${REPLAY_SOURCEMAP_KEY:-}
      # on puts each traced SDK call's ID into PocketBase's request log, for request explanations; off unless set to on.
      REPLAY_TRACE_REQUESTS: ${REPLAY_TRACE_REQUESTS:-}
      # Which recordings are read ahead for AI agents: errors (default), all or off. Others are read on first request.
      REPLAY_MCP_INDEX: ${REPLAY_MCP_INDEX:-}
      # Comma-separated browser origins allowed to call the MCP endpoint; agents send none and need nothing here.
      REPLAY_MCP_ORIGINS: ${REPLAY_MCP_ORIGINS:-}
    restart: unless-stopped
